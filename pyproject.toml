[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchquad"
version = "0.5.0"
description = "Package providing numerical integration methods for PyTorch, jax, TensorFlow and numpy."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10, <4"
license = { text = "GPL-3.0" }
authors = [
    { name = "ESA Advanced Concepts Team", email = "pablo.gomez@esa.int" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "loguru>=0.5.3",
    "matplotlib>=3.3.3",
    "scipy>=1.6.0",
    "tqdm>=4.56.1",
    "autoray>=0.5.0",
]

# PEP 508 cannot encode per-index URLs, so the backend extras below install only
# the default-index CPU builds. For GPU/accelerator builds, follow each
# framework's own install guide (they need CUDA/ROCm-specific wheels and index
# URLs that a plain extra cannot express). JAX and TensorFlow GPU wheels are
# Linux/WSL2-only.
[project.optional-dependencies]
# Development toolchain — mirrors the CI lint + test gates. Version floors track
# the pins used in the CI workflows; bump both together.
dev = [
    "pytest>=6.2.1",
    "pytest-cov>=4.0.0",
    "pytest-error-for-skips>=2.0.2",
    "ruff>=0.14.6",
    "pydoclint>=0.8.3",
    "vulture>=2.14",
    "pre-commit>=3.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=3.4.3",
    "sphinx_rtd_theme>=0.5.1",
]
# CPU/default-index backend conveniences. For GPU support, install the framework
# from its own guide instead of using these extras.
torch = ["torch>=2.1"]
jax = ["jax[cpu]>=0.4.17"]
tensorflow = ["tensorflow>=2.18.0"]
all = [
    "torch>=2.1",
    "jax[cpu]>=0.4.17",
    "tensorflow>=2.18.0",
]

[project.urls]
Homepage = "https://github.com/esa/torchquad"
Source = "https://github.com/esa/torchquad/"

[tool.setuptools]
packages = ["torchquad", "torchquad.integration", "torchquad.utils"]

[tool.ruff]
line-length = 100
# .vulture_whitelist.py is a vulture artifact (bare-name references), not runnable code
extend-exclude = ["my_notebooks", "build", "dist", ".vulture_whitelist.py"]

[tool.ruff.lint]
# The default selection (E4/E7/E9/F) already covers the severe-error gate
# (E9, F63, F7, F82) that flake8 enforced. These three are intentionally
# relaxed, matching the retired .flake8 config:
#   E402 - numerical backends are imported lazily, not at top of file
#   E501 - line length is handled by the formatter, not the linter
#   E203 - conflicts with the formatter's slice-spacing style
ignore = ["E203", "E402", "E501"]

[tool.pydoclint]
style = "google"
# Argument type hints are not required in signatures; the docstrings carry the
# types. Only docstring completeness and consistency (missing Args/Returns/Raises)
# is checked, not signature annotations.
arg-type-hints-in-signature = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true
# torchquad documents constructor arguments in the __init__ docstring rather
# than the class docstring, so allow that. Class-attribute cross-checking is
# too format-sensitive to enforce and is out of scope for the docstring gate.
allow-init-docstring = true
check-class-attributes = false

[tool.vulture]
paths = ["torchquad"]
# The blocking CI tier runs at 100% confidence; a 60% advisory tier runs
# non-blocking. Symbols used implicitly (autoray registrations, API hooks)
# that vulture cannot see belong in .vulture_whitelist.py, but prefer
# deleting dead code over whitelisting it.
min_confidence = 100

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:torch.meshgrid:UserWarning",                                                         # PyTorch meshgrid warning
    "ignore:Explicitly requested dtype.*truncated:UserWarning",                                  # JAX dtype warnings
    "ignore:In the next release:UserWarning",                                                    # TensorFlow warnings
    "ignore:integration_domain should be a list:RuntimeWarning",                                 # Intentional warning for conflicting backend arguments
    "ignore:To copy construct from a tensor.*recommended to use sourceTensor.clone:UserWarning", # PyTorch tensor copy warnings
    "ignore:Cannot update the VEGASMap.*integrand which evaluates to zero:RuntimeWarning",       # VEGAS warning for zero integrands
]
