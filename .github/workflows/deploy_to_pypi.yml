name: Upload Python Package to PyPI

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment must match the trusted publisher configured on PyPI.
    environment: pypi
    permissions:
      # OIDC token for PyPI trusted publishing — no stored API token needed.
      id-token: write
      # Declaring any permission drops the rest to none, so restore read access
      # for checkout (don't rely on the repo staying public).
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        # release/v1 is PyPA's intentionally auto-tracking major ref; Dependabot
        # cannot bump a branch ref, so this action is updated by PyPA, not us.
        uses: pypa/gh-action-pypi-publish@release/v1
